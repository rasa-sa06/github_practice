<!DOCTYPE html>
<html lang="ja">
<head>

<title>CONTACT | ぷてぃえーる</title>

</head>
<body>

<header class="site-header">
  <div class="logo kawaii"><a href="index.html">ぷてぃえーる</a></div>
  <button class="menu-btn" aria-label="メニュー"><img src="images/menu.png" alt=""></button>
</header>

<div class="lace"></div>

<main class="page">

  <img class="doily left"  style="top: 60px;"  src="images/lace-right.png"  alt="">
  <img class="doily right" style="top: 260px;" src="images/lace-left.png" alt="">

  <section class="section">
    <h1 class="section-heading">
      <img class="bow" src="images/ribbon2.png" alt="">
      CONTACT
    </h1>

    <p>オーダーメイドのご相談・マルシェ出店に関するお問い合わせは、下記フォームよりお気軽にご連絡ください。</p>

    <form class="contact-form" onsubmit="alert('（デモ用フォームのため送信されません）'); return false;">
      <label>
        お名前
        <input type="text" name="name" required>
      </label>
      <label>
        メールアドレス
        <input type="email" name="email" required>
      </label>
      <label>
        お問い合わせ内容
        <textarea name="message" rows="6" required></textarea>
      </label>
      <button type="submit">送信する</button>
    </form>
  </section>

</main>

<div class="lace flip"></div>
