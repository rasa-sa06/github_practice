<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GALLERY | ぷてぃえーる</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cherry+Bomb+One&family=Hachi+Maru+Pop&family=M+PLUS+Rounded+1c:wght@400;500;700&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="logo kawaii"><a href="index.html">ぷてぃえーる</a></div>
  <button class="menu-btn" aria-label="メニュー"><img src="images/menu.webp" alt="" loading="lazy" decoding="async"></button>
</header>

<div class="lace"></div>

<main class="page">

  <img class="doily left"  style="top: 60px;"  src="images/lace-right.webp"  alt="" loading="lazy" decoding="async">
  <img class="doily right" style="top: 400px;" src="images/lace-left.webp" alt="" loading="lazy" decoding="async">

  <section class="section">
    <h1 class="section-heading">
      <img class="bow" src="images/ribbon2.webp" alt="" loading="lazy" decoding="async">
      GALLERY
    </h1>

    <div class="gallery-row">
      <figure><img src="images/ig-image1.webp" alt="お花柄のシュシュ" loading="lazy" decoding="async"></figure>
      <figure><img src="images/ig-image2.webp" alt="いちご柄のヘアリボン" loading="lazy" decoding="async"></figure>
      <figure><img src="images/ig-image3.webp" alt="レース付きのヘアリボン" loading="lazy" decoding="async"></figure>
    </div>

    <div class="triple-photo">
      <figure><img src="images/image-1.webp" alt="砂場で遊ぶ女の子" loading="lazy" decoding="async"></figure>
      <figure><img src="images/image-2.webp" alt="ランドセル姿の女の子" loading="lazy" decoding="async"></figure>
      <figure><img src="images/image-3.webp" alt="ヘアアレンジをする親子" loading="lazy" decoding="async"></figure>
    </div>

    <div class="insta-bar">
      <a href="https://www.instagram.com/" target="_blank" rel="noopener">
        <img src="images/ig.webp" alt="" loading="lazy" decoding="async">
        <span>Instagram でもっとみる</span>
      </a>
    </div>
  </section>

</main>

<div class="lace flip"></div>

<footer class="site-footer">
  <nav class="footer-nav">
    <a href="index.html">TOP</a>
    <a href="about.html">ABOUT</a>
    <a href="custom.html">Custom Made</a>
    <a href="gallery.html" class="active">GALLERY</a>
    <a href="contact.html">CONTACT</a>
  </nav>
  <a class="contact-banner" href="contact.html">
    <img src="images/contact.webp" alt="" loading="lazy" decoding="async">
    <span>お問い合わせ &gt;&gt;</span>
  </a>
</footer>

</body>
</html>
